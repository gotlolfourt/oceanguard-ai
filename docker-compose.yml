version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: oceanguard-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-oceanguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oceanguard_dev_pass}
      POSTGRES_DB: ${DB_NAME:-oceanguard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oceanguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oceanguard-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: oceanguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oceanguard-net

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanguard-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oceanguard}:${DB_PASSWORD:-oceanguard_dev_pass}@postgres:5432/${DB_NAME:-oceanguard_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - oceanguard-net

  # AI Service
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: oceanguard-ai
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_PATH: /models
    ports:
      - "8001:8001"
    depends_on:
      - redis
    volumes:
      - ./ai:/app
      - ai_models:/models
    command: uvicorn app:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - oceanguard-net

  # Frontend (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: oceanguard-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
    command: npm run dev
    networks:
      - oceanguard-net

volumes:
  postgres_data:
  redis_data:
  ai_models:

networks:
  oceanguard-net:
    driver: bridge
